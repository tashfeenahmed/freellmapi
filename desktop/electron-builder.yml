appId: com.freellmapi.desktop
productName: FreeLLMAPI
directories:
  output: dist-electron
files:
  - build/**/*
  - renderer/**/*
  - assets/**/*
  - "!**/*.map"
# Update metadata. With a publish provider configured, electron-builder emits
# latest.yml / latest-mac.yml next to the installers — the manifest ANY updater
# (electron-updater or otherwise) reads to learn what the newest version is and
# where to fetch it. Releases up to v0.6.6 shipped installers only, so nothing
# could tell an installed app that a newer one exists. Uploading stays OFF
# (--publish never in the scripts and the workflow); the release workflow
# attaches the files itself. See #703.
publish:
  provider: github
  owner: tashfeenahmed
  repo: freellmapi
asar: true
# Linux chrome-sandbox must be mode 4755 (setuid) in the .deb; otherwise
# Electron aborts at launch (#1229). Path is relative to desktop/.
afterPack: ./scripts/after-pack-linux-sandbox.mjs
afterSign: ./scripts/after-sign-notarize.mjs
asarUnpack:
  - "**/node_modules/@img/**"
  - "**/node_modules/better-sqlite3/**/*.node"
  - "**/node_modules/better-sqlite3/build/Release/**"
# client-dist is staged into desktop/ by `npm run stage:client` (scripts/stage-client.mjs).
# It MUST stay a path inside desktop/: a `../` source makes electron-builder treat the
# repo root as a copy base and reject every root file ("must be under .../desktop/").
extraResources:
  - from: client-dist
    to: client-dist
mac:
  artifactName: "${productName}-${version}-macos-${arch}.${ext}"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.inherit.plist
  # Notarization runs in afterSign (scripts/after-sign-notarize.mjs) rather
  # than electron-builder's built-in step, which staples once and fails the
  # whole build when Apple's ticket lookup drops the connection (v0.14.0/1).
  notarize: false
  # Select the architecture with --arm64 or --x64 in the build command.
  # Per-target arch lists override that selection and make each CI job build
  # both architectures, including the native SQLite module for the other CPU.
  target:
    - target: dmg
    - target: zip
  extendInfo:
    LSUIElement: 1
# The DMG is the file people actually download, so it is the file macOS
# quarantines and assesses. electron-builder signs and notarizes the .app inside
# but leaves the DMG itself unsigned, which leaves `spctl -t install` on the
# download reporting "no usable signature" — #373's "damaged" report. Signing it
# here is also what makes it *eligible* for notarization; the release workflow
# submits and staples it afterwards. This runs before the blockmap and
# latest-mac.yml are computed, so those describe the signed file.
dmg:
  sign: true
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # electron-builder converts a >=256px PNG to .ico at build time.
  icon: assets/appicon_1024.png
# Microsoft Store package (#1933). Windows Smart App Control blocks the
# unsigned NSIS .exe outright; an MSIX submitted to the Store is signed by
# Microsoft, so Store installs run with Smart App Control on. Built only by
# `npm run dist:store` / the release workflow's Store step, never alongside the
# NSIS target. The identity values must match Partner Center's Product
# identity page for product 9PBN6G8K2B7F exactly, or the Store rejects the
# upload. Tile images live in store-assets/appx (the store build points
# buildResources there, because build/ here is compiled app code).
appx:
  identityName: TashAhmed.FreeLLMAPI
  publisher: CN=157744EA-1B8F-40BE-9B6E-1FE92036B40F
  publisherDisplayName: Tash Ahmed
  applicationId: FreeLLMAPI
  displayName: FreeLLMAPI
  backgroundColor: transparent
  languages:
    - en-US
  # electron-builder defaults to MinVersion 10.0.14316 (1607), which Partner
  # Center rejects for MSIX ("MinVersion <= 10.0.17134.0"). Electron 38 needs
  # Windows 10 1809+ anyway.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  # .msix, not .appx: same package format, and `msstore publish` only picks up
  # .msix / .msixupload files.
  artifactName: "${productName}-Store-${version}.msix"
linux:
  category: Development;Utility;
  icon: assets/appicon_1024.png # electron-builder can automatically scale PNGs
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.xz
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
nsis:
  # electron-builder's default NSIS name has spaces ("FreeLLMAPI Setup x.y.z.exe")
  # and latest.yml records it with dashes, while GitHub stores the upload with
  # dots — so the updater asked for a file the release did not have. A name with
  # no spaces is the same string in all three places.
  artifactName: "${productName}-Setup-${version}.${ext}"
  oneClick: true
  # Grants the GPU sandbox read access to the install folder (#1759).
  include: installer/installer.nsh
  deleteAppDataOnUninstall: false
