name: Agent secrets

on:
  pull_request:

permissions:
  contents: read

jobs:
  gglint:
    name: gglint secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: corridor/gglint@fb36ea3940f571edc5a1cab08cd155401b46d3a4 # v0.5.1
        with:
          command: secrets
          comment: "false"
