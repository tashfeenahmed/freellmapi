services:
  # Redis Streams backend for real-time pub/sub (like Trading Bot)
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # JiMesh Go backend (gRPC + HTTP/1.1+2, HTTP/3 TODO)
  jimesh:
    image: golang:1.23-bookworm
    working_dir: /src
    user: "0:0"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3010
      HOST_BIND: 0.0.0.0
      REDIS_URL: "redis://redis:6379"
      REDIS_ENABLED: "true"
    ports:
      - "${HOST_BIND:-0.0.0.0}:3010:3010"          # HTTP/1.1+2 REST
      - "${HOST_BIND:-0.0.0.0}:3009:3009"       # gRPC
    volumes:
      - jimesh-data:/data
      - ./src/backend:/src
      - /home/ji/go/pkg/mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    command: ["go", "run", "cmd/server/main.go", "-sqlite-path=/data/jimesh.db", "-http-port=3010", "-grpc-port=3009"]
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--timeout=2", "--spider", "http://localhost:3010/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # JiMesh React Admin Dashboard Frontend (Vite + React)
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - /app/node_modules                         # Keeps node_modules inside container, away from host!
      - node-cache:/root/.npm                     # Cache npm packages across restarts
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - NODE_ENV=development
      - VITE_BACKEND_HOST=jimesh
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    depends_on:
      - jimesh
    restart: unless-stopped

volumes:
  jimesh-data:
  redis-data:
  go-build:
  node-cache: